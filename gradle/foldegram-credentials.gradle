// Values intentionally never come from checked-in Gradle properties or -P arguments.
// Environment wins over the ignored, developer-local properties file.
def privateConfiguration = new Properties()
def privateFile = rootProject.file('foldegram.properties')
if (privateFile.exists()) {
    privateFile.withInputStream { privateConfiguration.load(it) }
}
def readPrivateValue = { String name, boolean trim = true ->
    def value = System.getenv(name) ?: privateConfiguration.getProperty(name, '')
    trim ? value.trim() : value
}
// Release signing is opt-in and uses an existing, user-owned local keystore only.
ext.foldegramSigning = [
    storePath: readPrivateValue('FOLDEGRAM_KEYSTORE_PATH'),
    storePassword: readPrivateValue('FOLDEGRAM_KEYSTORE_PASSWORD', false),
    keyAlias: readPrivateValue('FOLDEGRAM_KEY_ALIAS', false),
    keyPassword: readPrivateValue('FOLDEGRAM_KEY_PASSWORD', false)
]

def apiId = readPrivateValue('FOLDEGRAM_API_ID')
def apiHash = readPrivateValue('FOLDEGRAM_API_HASH')
def validApiId = apiId ==~ /[1-9][0-9]{0,9}/
if (validApiId) {
    validApiId = apiId.toLong() <= Integer.MAX_VALUE && apiId != '4'
}
def validApiHash = apiHash ==~ /[0-9a-fA-F]{32}/

ext.foldegramCompileOnly = providers.gradleProperty('foldegramCompileOnly').orElse('false').get().toBoolean()
ext.foldegramStubCredentials = providers.gradleProperty('foldegramStubCredentials').orElse('false').get().toBoolean()
if (foldegramCompileOnly && foldegramStubCredentials) {
    throw new GradleException('Choose either foldegramCompileOnly or foldegramStubCredentials, not both.')
}
// Sanitized literals only. Missing/invalid input cannot be injected into generated Java.
ext.foldegramApiId = validApiId && !foldegramStubCredentials && !foldegramCompileOnly ? apiId.toInteger() : 0
ext.foldegramApiHash = validApiHash && !foldegramStubCredentials && !foldegramCompileOnly ? apiHash : ''

tasks.register('verifyFoldegramCredentials') {
    group = 'verification'
    description = 'Checks private Telegram API configuration without printing credentials.'
    doLast {
        if (rootProject.ext.foldegramCompileOnly) {
            logger.lifecycle('Foldegram compile-only validation: placeholder API values; APK packaging and signing disabled.')
            return
        }
        if (rootProject.ext.foldegramStubCredentials) {
            logger.lifecycle('Foldegram setup-only APK: no Telegram client, login, or network access.')
            return
        }
        if (!validApiId || !validApiHash) {
            throw new GradleException('Foldegram requires your own FOLDEGRAM_API_ID and FOLDEGRAM_API_HASH. '
                + 'Set environment variables or add them to the git-ignored foldegram.properties file. '
                + 'See docs/BUILD_FOLDEGRAM.md. Upstream Telegram credentials are not accepted. '
                + 'For a non-functional, no-login setup APK only, use -PfoldegramStubCredentials=true.')
        }
    }
}

// Compile-only mode permits Java, resources, native compilation, lint and manifest
// merging, but never a distributable APK/AAB, signing, install, publish or AAR bundle.
// Check task types as well as names: AGP task aliases and Android-test variants
// must not provide a back door. Do not block a library's packageDebugResources.
def forbiddenArtifactTaskTypes = [
    'com.android.build.gradle.tasks.PackageAndroidArtifact',
    'com.android.build.gradle.tasks.PackageApplication',
    'com.android.build.gradle.internal.tasks.PackageBundleTask',
    'com.android.build.gradle.internal.tasks.FinalizeBundleTask',
    'com.android.build.gradle.internal.tasks.ApkZipPackagingTask',
    'com.android.build.gradle.internal.tasks.BundleToApkTask',
    'com.android.build.gradle.internal.tasks.BundleToStandaloneApkTask',
    'com.android.build.gradle.internal.tasks.ExtractApksTask',
    'com.android.build.gradle.internal.tasks.InstallVariantTask',
    'com.android.build.gradle.internal.tasks.InstallVariantViaBundleTask',
    'com.android.build.gradle.internal.tasks.ValidateSigningTask',
    'com.android.build.gradle.internal.tasks.SigningConfigWriterTask'
] as Set

gradle.taskGraph.whenReady { graph ->
    if (!rootProject.ext.foldegramCompileOnly) {
        return
    }
    def forbidden = graph.allTasks.find { task ->
        def type = task.class
        while (type != null) {
            if (forbiddenArtifactTaskTypes.contains(type.name)) {
                return true
            }
            type = type.superclass
        }
        def name = task.name
        // Lint's internal dependency snapshot is not a distributable library/APK.
        if (name ==~ /(?i)(bundle.*LocalLintAar|bundle.*ClassesToCompileJar|bundle.*ClassesToRuntimeJar)/) {
            return false
        }
        if (name ==~ /(?i)(assemble.*|bundle.*Aar|publish.*|install.*|validateSigning.*|sign.*Bundle|.*Apk.*|package.*AndroidTest)/) {
            return true
        }
        def appProject = task.project.path == ':TMessagesProj_AppFoldegram' ||
                task.project.plugins.hasPlugin('com.android.application') ||
                task.project.plugins.hasPlugin('com.android.test')
        appProject && (name ==~ /(?i)(package.*|bundle.*|sign.*)/) &&
                !(name ==~ /(?i)(package.*Resources|package.*Assets|signingReport)/)
    }
    if (forbidden != null) {
        throw new GradleException('foldegramCompileOnly is for compiler/lint validation only; APK/AAB packaging, signing, assembling, AAR distribution, installing and publishing are disabled. Blocked task: ' + forbidden.path)
    }
}

tasks.register('verifyFoldegramReleaseSigning') {
    group = 'verification'
    description = 'Requires an explicitly configured existing private release keystore.'
    doLast {
        def signing = rootProject.ext.foldegramSigning
        if (signing.values().any { it.isEmpty() }) {
            throw new GradleException('Release signing requires FOLDEGRAM_KEYSTORE_PATH, FOLDEGRAM_KEYSTORE_PASSWORD, FOLDEGRAM_KEY_ALIAS and FOLDEGRAM_KEY_PASSWORD in private environment variables or foldegram.properties. See docs/BUILD_FOLDEGRAM.md. No debug-key fallback is permitted.')
        }
        def keystore = rootProject.file(signing.storePath)
        if (!keystore.isFile() || !keystore.canRead()) {
            throw new GradleException('The configured Foldegram release keystore does not exist, cannot be read, or is not a file. Check FOLDEGRAM_KEYSTORE_PATH locally; its value is intentionally not logged.')
        }
        if (keystore.canonicalFile == rootProject.file('TMessagesProj/config/release.keystore').canonicalFile) {
            throw new GradleException('The publicly known upstream development keystore cannot sign a Foldegram release. Configure your own existing private signing identity.')
        }
    }
}
