// Foldegram is the only supported APK target in this fork. Upstream app modules
// remain in the checkout for reference, but their vendor credentials are not used.
include ':TMessagesProj_AppFoldegram'

def foldegramSetupOnly = providers.gradleProperty('foldegramStubCredentials').orElse('false').get().toBoolean()
if (!foldegramSetupOnly) {
    include ':TMessagesProj'
    include ':jlatexmath'
    project(':jlatexmath').projectDir = file('TMessagesProj/lib/jlatexmath/jlatexmath')

    gradle.ext.androidxMediaModulePrefix = 'TMessagesProj_Modules:media3:media-'
    apply from: file('TMessagesProj_Modules/media/core_settings.gradle')
}

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}
